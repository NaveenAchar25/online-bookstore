server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

   
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite appends a content hash, e.g.
    # index-C2yWo2Fa.js) are safe to cache aggressively — a change to the
    # file's content produces a new filename, so there's no staleness risk.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
}
